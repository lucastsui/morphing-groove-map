# XcodeGen spec -> generates GroovePlayer.xcodeproj (no Xcode needed to GENERATE;
# Xcode is needed to BUILD/RUN). Regenerate with: xcodegen generate
name: GroovePlayer
options:
  bundleIdPrefix: com.lucastsui
  deploymentTarget:
    iOS: "16.0"

packages:
  MGMKit:
    path: ../MGMKit

targets:
  GroovePlayer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    resources:
      - Resources
    dependencies:
      - package: MGMKit
        product: MGMKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Groove Player
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIDeviceFamily: [1, 2]   # iPhone + iPad
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
